name: Annotated immutable release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated tag to release
        required: true
        type: string
      commit:
        description: Exact commit targeted by the annotated tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify exact annotated tag target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: bash scripts/verify-release-boundary.sh tag "$RELEASE_TAG" "$RELEASE_COMMIT"
      - name: Verify formatting
        run: |
          set -euo pipefail
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files"
      - name: Prepare measurement directories
        run: |
          echo "METRICS_DIR=$RUNNER_TEMP/gooo-meta-capability-attenuator-measurements" >> "$GITHUB_ENV"
          echo "EVIDENCE_DIR=$RUNNER_TEMP/gooo-meta-capability-attenuator-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gooo-meta-capability-attenuator-measurements"
      - name: Measure compile
        run: bash scripts/measure-step.sh "$METRICS_DIR/compile.metrics" go test -run '^$' ./...
      - name: Run vet
        run: go vet ./...
      - name: Measure tests
        run: bash scripts/measure-step.sh "$METRICS_DIR/test.metrics" go test ./...
      - name: Measure build
        run: bash scripts/measure-step.sh "$METRICS_DIR/build.metrics" go build -trimpath -o "$RUNNER_TEMP/gooo-meta-capability-attenuator" ./cmd/gooo-meta-capability-attenuator
      - name: Measure conformance
        run: |
          set -euo pipefail
          bash scripts/measure-step.sh "$METRICS_DIR/conformance.metrics" bash scripts/conformance.sh "$RUNNER_TEMP/gooo-meta-capability-attenuator" "$METRICS_DIR"
          conformance_wall_ms=$(awk -F= '$1 == "wall_ms" {print $2}' "$METRICS_DIR/conformance.metrics")
          conformance_peak_rss_kib=$(awk -F= '$1 == "peak_rss_kib" {print $2}' "$METRICS_DIR/conformance.metrics")
          bash scripts/patch-measurement.sh "$EVIDENCE_DIR/attenuation-receipt.json" conformance "$conformance_wall_ms" "$conformance_peak_rss_kib"
      - name: Measure integration
        run: |
          set -euo pipefail
          bash scripts/measure-step.sh "$METRICS_DIR/integration.metrics" bash scripts/integration.sh "$EVIDENCE_DIR"
          integration_wall_ms=$(awk -F= '$1 == "wall_ms" {print $2}' "$METRICS_DIR/integration.metrics")
          integration_peak_rss_kib=$(awk -F= '$1 == "peak_rss_kib" {print $2}' "$METRICS_DIR/integration.metrics")
          bash scripts/patch-measurement.sh "$EVIDENCE_DIR/attenuation-receipt.json" integration "$integration_wall_ms" "$integration_peak_rss_kib"
      - name: Run semantic audit after measurement patch
        run: bash scripts/semantic-audit.sh "$EVIDENCE_DIR"
      - name: Verify complete measurement receipt
        run: |
          jq -e '
            .tests == {total:8,selected:8,executed:8,reused:0,failed:0,unknown:0} and
            .local_execution == {go_test:0,go_build:0,go_vet:0,conformance:0,integration:0} and
            ([.metrics.measurements | .[]] | all(. | type == "number" and . > 0))
          ' "$EVIDENCE_DIR/attenuation-receipt.json" >/dev/null
      - name: Package evidence
        id: package
        run: |
          asset="$RUNNER_TEMP/gooo-meta-capability-attenuator-${{ inputs.tag }}-ci-evidence.tgz"
          tar -czf "$asset" -C "$EVIDENCE_DIR" .
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Create draft release with standard GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes "Immutable release for $RELEASE_TAG at $RELEASE_COMMIT."
      - name: Upload evidence asset to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" "${{ steps.package.outputs.asset }}"
      - name: Publish release once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Verify public immutable release and asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if bash scripts/verify-release-boundary.sh release "$RELEASE_TAG" "$RELEASE_COMMIT"; then
              exit 0
            fi
            sleep 5
          done
          exit 1
