name: Gooo capability attenuation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-validation:
    name: Go 1.27 validation
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify declared toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l $(git ls-files '*.go'))
          test -z "$files"
      - name: Run vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...
      - name: Build evaluator
        run: go build -trimpath -o "$RUNNER_TEMP/gooo-meta-capability-attenuator" ./cmd/gooo-meta-capability-attenuator

  conformance:
    name: Semantic IR conformance
    needs: go-validation
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false
      - name: Verify declared toolchain
        run: test "$(go env GOVERSION)" = "go1.27.0"
      - name: Build evaluator for conformance
        run: go build -trimpath -o "$RUNNER_TEMP/gooo-meta-capability-attenuator" ./cmd/gooo-meta-capability-attenuator
      - name: Run generated semantic conformance
        run: bash scripts/conformance.sh "$RUNNER_TEMP/gooo-meta-capability-attenuator"
      - name: Run semantic integration
        run: bash scripts/integration.sh "$RUNNER_TEMP/gooo-meta-capability-attenuator-evidence"
      - name: Run semantic audit
        run: bash scripts/semantic-audit.sh "$RUNNER_TEMP/gooo-meta-capability-attenuator-evidence"
      - name: Publish human report
        run: cat "$RUNNER_TEMP/gooo-meta-capability-attenuator-evidence/attenuation-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-meta-capability-attenuator-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-meta-capability-attenuator-evidence
          if-no-files-found: error
